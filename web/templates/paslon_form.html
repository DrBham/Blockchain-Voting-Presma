{% extends "base.html" %}
{% block content %}
<h2>{{ action }} Paslon</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Nomor</label>
    <input name="nomor" class="form-control" value="{{ paslon.nomor if paslon else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Nama</label>
    <input name="nama" class="form-control" value="{{ paslon.nama if paslon else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Visi</label>
    <textarea name="visi" class="form-control">{{ paslon.visi if paslon else '' }}</textarea>
  </div>
  <button class="btn btn-primary">{{ action }}</button>
  <a class="btn btn-secondary" href="/paslon">Batal</a>
</form>
{% endblock %}
