<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Presma Voting Blockchain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Presma Voting</a>
    <div>
      <a class="btn btn-sm btn-outline-light" href="/paslon">Paslon</a>
      <a class="btn btn-sm btn-outline-light" href="/chain/verify">Verify</a>
      <a class="btn btn-sm btn-outline-light" href="/node/status">Node</a>
    </div>
  </div>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
